# DocRepo has no pyproject.toml: it isn't installed as a package. A [project]
# table named "docrepo" made JFrog's scan treat it as PyPI's unrelated GPL-3.0
# package of that name, instead of reading requirements.txt.
#
# Each run's temporary folder is .pytest_tmp\run-<process id>, set in tests\conftest.py (release 5.88), so two runs at
# once don't share one. The cache (.pytest_cache, ignored by git) keeps the last failures for --lf.
# The fast run, with no Qt:  pytest -m "not gui"
[pytest]
testpaths = tests
markers =
    gui: a test in a module that uses Qt (imports docrepo.ui or PySide6, or sets QT_QPA_PLATFORM); marked by conftest.py
